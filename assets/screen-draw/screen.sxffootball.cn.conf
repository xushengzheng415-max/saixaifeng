server {
    server_name screen.sxffootball.cn;
    root /var/www/screen;
    index index.html;
    location /screen-api/ {
        proxy_pass http://127.0.0.1:4090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/screen.sxffootball.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screen.sxffootball.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name screen.sxffootball.cn;
    return 301 https://$host$request_uri;
}
