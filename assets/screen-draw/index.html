<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赛小蜂 · 抽签大屏</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061d13;color:#f5fff8}body{background:linear-gradient(90deg,rgba(2,24,15,.92),rgba(2,24,15,.62)),url('./background.png') center/cover fixed no-repeat}.screen{min-height:100vh;padding:38px 5vw 42px;display:flex;flex-direction:column}.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:112px;border-bottom:1px solid rgba(205,255,222,.2);padding-bottom:22px}.brand{display:flex;align-items:center;gap:15px;z-index:1}.brand-logo{width:76px;height:76px;object-fit:contain;border-radius:18px;background:#e7fff0;padding:7px}.title-block{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.eyebrow{margin:0 0 7px;color:#a5eac0;font-size:15px;letter-spacing:.16em}.title{margin:0;font-size:clamp(34px,4vw,62px);letter-spacing:.03em}.fullscreen-btn{padding:9px 13px;border:1px solid rgba(205,255,222,.35);border-radius:8px;color:#d6ffe2;background:rgba(8,77,45,.58);cursor:pointer;font:inherit;z-index:1}.hero{position:relative;display:flex;align-items:center;justify-content:center;min-height:210px;padding:28px 0 34px;text-align:center}.hero>div:first-child{display:flex;flex-direction:column;align-items:center}.hero h2{margin:0;color:#fff;font-size:clamp(34px,4vw,62px);letter-spacing:.06em}.status{display:flex;align-items:center;gap:11px;color:#b4eec8;font-size:19px}.status i{width:12px;height:12px;border-radius:50%;background:#5deda0;box-shadow:0 0 16px #5deda0}.draw-group{display:inline-flex;margin-top:12px;padding:7px 19px;border:1px solid rgba(255,220,121,.52);border-radius:10px;color:#ffdc79;background:rgba(67,47,10,.44);font-size:30px;font-weight:800}.progress{position:absolute;right:0;bottom:34px;width:min(390px,32vw);text-align:right}.progress strong{display:block;font-size:42px;color:#ffdc79}.progress span{color:#b8d6c1;font-size:16px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;flex:1}.group{padding:25px 28px 18px;border:1px solid rgba(205,255,222,.24);border-radius:16px;background:rgba(4,48,29,.74);box-shadow:0 16px 45px rgba(0,0,0,.18);backdrop-filter:blur(8px)}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.group h3{margin:0;color:#9af0b7;font-size:34px}.count{color:#ffdc79;font-size:24px}.slots{list-style:none;margin:0;padding:0}.slots li{display:grid;grid-template-columns:70px 1fr;align-items:center;min-height:76px;border-top:1px solid rgba(205,255,222,.12);font-size:27px}.slot{color:#83bd98;font-size:18px;font-weight:700}.team{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:14px}.team-logo{width:52px;height:52px;flex:0 0 52px;object-fit:contain;border-radius:50%;background:#edfff3}.empty{color:#688d76;font-size:22px}.empty::after{content:'待抽取';}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:25px;color:#93bda1;font-size:15px}.offline{color:#f4c36d}@media(max-width:900px){.groups{grid-template-columns:1fr}}@media(max-width:760px){.screen{padding:24px 18px}.topbar,.hero{align-items:flex-start;flex-direction:column}.title-block{position:static;align-items:flex-start;transform:none;order:2}.progress{position:static;width:auto;text-align:left}.groups{grid-template-columns:1fr}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar"><div class="brand"><img class="brand-logo" id="tournamentLogo" alt="赛事 Logo" /></div><div class="title-block"><p class="eyebrow">SAIXIAOFENG FOOTBALL</p><h1 class="title" id="title">赛事抽签</h1></div><button class="fullscreen-btn" id="fullscreenBtn">全屏</button></header>
    <section class="hero"><div><h2>抽签仪式</h2><div class="draw-group" id="division">当前组别</div><div class="status"><i></i><span id="status">等待抽签开始</span></div></div><div class="progress"><strong id="progress">0 / 0</strong><span>已分配签位</span></div></section>
    <section class="groups" id="groups"></section>
    <footer class="footer"><span>现场抽签大屏</span><span class="offline" id="connection">等待后台连接</span></footer>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const title=params.get('title')||'赛事抽签';const division=params.get('divisionName')||'当前组别';const logo=document.querySelector('#tournamentLogo');const logoUrl=params.get('tournamentLogo')||'';logo.onerror=()=>{logo.style.display='none'};if(logoUrl){logo.src=logoUrl}else{logo.style.display='none'}document.querySelector('#title').textContent=title;document.querySelector('#division').textContent=division;document.querySelector('#fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
    const fallback=[{name:'A组',code:'A',slots:Array(5).fill(null)},{name:'B组',code:'B',slots:Array(5).fill(null)}];
    function render(groups,status,state){const flat=groups.flatMap(g=>g.slots||[]);const assigned=flat.filter(Boolean).length;if(state?.title)document.querySelector('#title').textContent=state.title;if(state?.tournamentLogo){logo.src=state.tournamentLogo;logo.style.display='block'}if(state?.divisionName)document.querySelector('#division').textContent=state.divisionName;document.querySelector('#progress').textContent=`${assigned} / ${flat.length}`;document.querySelector('#status').textContent=status|| (assigned?'抽签进行中':'等待抽签开始');document.querySelector('#connection').textContent='已连接后台';document.querySelector('#connection').classList.remove('offline');document.querySelector('#groups').innerHTML=groups.map(g=>`<article class="group"><header class="group-head"><h3>${g.name||g.code+'组'}</h3><span class="count">${(g.slots||[]).filter(Boolean).length}/${(g.slots||[]).length}</span></header><ol class="slots">${(g.slots||[]).map((team,i)=>`<li>${`<span class="slot">${g.code||''}${i+1}</span>`}${team?`<span class="team">${team.logo?`<img class="team-logo" src="${team.logo}" alt="" onerror="this.style.display='none'">`:''}${team.name||team.teamName||'未命名球队'}</span>`:'<span class="empty"></span>'}</li>`).join('')}</ol></article>`).join('')}
    async function refresh(){try{let response=await fetch(`/screen-api/state?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error('api unavailable');const state=await response.json();render(state.groups||fallback,state.status,state);return}catch(e){try{const response=await fetch(`./screen-state.json?t=${Date.now()}`,{cache:'no-store'});const state=await response.json();render(state.groups||fallback,state.status,state)}catch{render(fallback,'等待后台连接')}document.querySelector('#connection').textContent='等待后台连接';document.querySelector('#connection').classList.add('offline')}}render(fallback);refresh();setInterval(refresh,2000);
  </script>
</body>
</html>
