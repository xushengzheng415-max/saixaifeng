<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赛小蜂 · 抽签大屏</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061d13;color:#f5fff8}body{background:linear-gradient(90deg,rgba(2,24,15,.92),rgba(2,24,15,.62)),url('./background.png') center/cover fixed no-repeat}.screen{min-height:100vh;padding:38px 5vw 42px;display:flex;flex-direction:column}.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:92px;border-bottom:1px solid rgba(205,255,222,.2);padding-bottom:22px}.brand{display:flex;align-items:center;gap:15px;z-index:1}.brand-logo{width:68px;height:68px;object-fit:contain;border-radius:18px;background:#e7fff0;padding:7px}.title-block{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.eyebrow{margin:0 0 7px;color:#a5eac0;font-size:13px;letter-spacing:.16em}.title{margin:0;font-size:clamp(28px,3.5vw,52px);letter-spacing:.03em}.division{padding:11px 16px;border:1px solid rgba(205,255,222,.28);border-radius:9px;color:#d6ffe2;background:rgba(8,77,45,.58);font-size:18px;z-index:1}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:38px 0 25px}.hero h2{margin:0;color:#fff;font-size:clamp(34px,4.8vw,70px);letter-spacing:.06em}.status{display:flex;align-items:center;gap:11px;color:#b4eec8;font-size:16px}.status i{width:10px;height:10px;border-radius:50%;background:#5deda0;box-shadow:0 0 16px #5deda0}.draw-group{display:inline-flex;margin-top:14px;padding:8px 15px;border:1px solid rgba(255,220,121,.48);border-radius:8px;color:#ffdc79;background:rgba(67,47,10,.44);font-size:22px;font-weight:700}.progress{width:min(390px,32vw);text-align:right}.progress strong{display:block;font-size:30px;color:#ffdc79}.progress span{color:#b8d6c1;font-size:13px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;flex:1}.group{padding:22px 24px 15px;border:1px solid rgba(205,255,222,.24);border-radius:16px;background:rgba(4,48,29,.74);box-shadow:0 16px 45px rgba(0,0,0,.18);backdrop-filter:blur(8px)}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.group h3{margin:0;color:#9af0b7;font-size:25px}.count{color:#ffdc79;font-size:18px}.slots{list-style:none;margin:0;padding:0}.slots li{display:grid;grid-template-columns:50px 1fr;align-items:center;min-height:56px;border-top:1px solid rgba(205,255,222,.12);font-size:19px}.slot{color:#83bd98;font-size:14px;font-weight:700}.team{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{color:#688d76;font-size:16px}.empty::after{content:'待抽取';}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:25px;color:#93bda1;font-size:13px}.offline{color:#f4c36d}@media(max-width:760px){.screen{padding:24px 18px}.topbar,.hero{align-items:flex-start;flex-direction:column}.title-block{position:static;align-items:flex-start;transform:none;order:2}.division{align-self:flex-start}.progress{width:auto;text-align:left}.groups{grid-template-columns:1fr}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar"><div class="brand"><img class="brand-logo" src="./logo-saixiaofeng.png" alt="赛小蜂" /></div><div class="title-block"><p class="eyebrow">SAIXIAOFENG FOOTBALL</p><h1 class="title" id="title">赛事抽签</h1></div><div class="division" id="division">当前组别</div></header>
    <section class="hero"><div><h2>抽签分组</h2><div class="status"><i></i><span id="status">等待抽签开始</span></div><div class="draw-group" id="drawGroup">当前组别</div></div><div class="progress"><strong id="progress">0 / 0</strong><span>已分配签位</span></div></section>
    <section class="groups" id="groups"></section>
    <footer class="footer"><span>现场抽签大屏</span><span class="offline" id="connection">等待后台连接</span></footer>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const title=params.get('title')||'赛事抽签';const division=params.get('divisionName')||params.get('divisionId')||'当前组别';document.querySelector('#title').textContent=title;document.querySelector('#division').textContent=division;document.querySelector('#drawGroup').textContent=division;
    const fallback=[{name:'A组',code:'A',slots:Array(5).fill(null)},{name:'B组',code:'B',slots:Array(5).fill(null)}];
    function render(groups,status){const flat=groups.flatMap(g=>g.slots||[]);const assigned=flat.filter(Boolean).length;document.querySelector('#progress').textContent=`${assigned} / ${flat.length}`;document.querySelector('#status').textContent=status|| (assigned?'抽签进行中':'等待抽签开始');document.querySelector('#connection').textContent='已连接后台';document.querySelector('#connection').classList.remove('offline');document.querySelector('#groups').innerHTML=groups.map(g=>`<article class="group"><header class="group-head"><h3>${g.name||g.code+'组'}</h3><span class="count">${(g.slots||[]).filter(Boolean).length}/${(g.slots||[]).length}</span></header><ol class="slots">${(g.slots||[]).map((team,i)=>`<li>${`<span class="slot">${g.code||''}${i+1}</span>`}${team?`<span class="team">${team.name||team.teamName||'未命名球队'}</span>`:'<span class="empty"></span>'}</li>`).join('')}</ol></article>`).join('')}
    async function refresh(){try{const response=await fetch(`./screen-state.json?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error('state unavailable');const state=await response.json();render(state.groups||fallback,state.status);return}catch(e){render(fallback,'等待后台连接');document.querySelector('#connection').textContent='等待后台连接';document.querySelector('#connection').classList.add('offline')}}render(fallback);refresh();setInterval(refresh,2000);
  </script>
</body>
</html>
