<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 - 赛小蜂足球赛事管理系统</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@2.6.3/dist/index.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 50%, #43A047 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reset-container {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 440px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .reset-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .reset-header h1 {
      font-size: 24px;
      color: #1B5E20;
      margin-bottom: 8px;
    }
    .reset-header p {
      font-size: 14px;
      color: #888;
    }
    .reset-form {
      margin-top: 24px;
    }
    .reset-form .el-form-item {
      margin-bottom: 20px;
    }
    .reset-btn {
      width: 100%;
      height: 44px;
      font-size: 16px;
    }
    .reset-tip {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      line-height: 1.6;
    }
    .reset-success {
      text-align: center;
      padding: 20px 0;
    }
    .reset-success .icon {
      font-size: 64px;
      color: #67C23A;
      margin-bottom: 16px;
    }
    .reset-success h3 {
      color: #333;
      margin-bottom: 12px;
    }
    .reset-success p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .reset-error {
      text-align: center;
      padding: 20px 0;
    }
    .reset-error .icon {
      font-size: 64px;
      color: #F56C6C;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 重置密码表单 -->
    <div class="reset-container" v-if="!success && !invalid">
      <div class="reset-header">
        <h1>🔐 重置密码</h1>
        <p>赛小蜂足球赛事管理系统</p>
      </div>

      <el-form class="reset-form" :model="form" :rules="rules" ref="formRef" @submit.prevent="submitReset">
        <el-form-item prop="newPassword">
          <el-input
            type="password"
            v-model="form.newPassword"
            placeholder="请输入新密码"
            size="large"
            show-password
          ></el-input>
        </el-form-item>
        <el-form-item prop="confirmPassword">
          <el-input
            type="password"
            v-model="form.confirmPassword"
            placeholder="请再次输入新密码"
            size="large"
            show-password
            @keyup.enter="submitReset"
          ></el-input>
        </el-form-item>

        <div class="reset-tip">
          ⚠️ 密码规则：必须同时包含大写字母、小写字母、数字，且不少于8位
        </div>

        <el-form-item style="margin-top: 24px;">
          <el-button
            type="primary"
            class="reset-btn"
            :loading="loading"
            @click="submitReset"
          >重置密码</el-button>
        </el-form-item>
      </el-form>
    </div>

    <!-- 重置成功 -->
    <div class="reset-container reset-success" v-if="success">
      <div class="icon">✅</div>
      <h3>密码重置成功！</h3>
      <p>您可以使用新密码登录系统了</p>
      <el-button type="primary" @click="goLogin">返回登录</el-button>
    </div>

    <!-- 链接无效/过期 -->
    <div class="reset-container reset-error" v-if="invalid">
      <div class="icon">❌</div>
      <h3>重置链接无效或已过期</h3>
      <p>请重新申请"忘记密码"，获取新的重置链接</p>
      <el-button type="primary" @click="goLogin">返回登录</el-button>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed, onMounted } = Vue

    createApp({
      setup() {
        const formRef = ref(null)
        const loading = ref(false)
        const success = ref(false)
        const invalid = ref(false)

        const form = reactive({
          newPassword: '',
          confirmPassword: ''
        })

        // 从 URL 读取 token 和 email
        const params = new URLSearchParams(window.location.search)
        const token = params.get('token') || ''
        const email = params.get('email') || ''

        // 密码规则校验
        const validatePassword = (rule, value, callback) => {
          if (!value) {
            callback(new Error('请输入密码'))
            return
          }
          if (value.length < 8) {
            callback(new Error('密码长度不少于8位'))
            return
          }
          if (!/[A-Z]/.test(value)) {
            callback(new Error('密码必须包含大写字母'))
            return
          }
          if (!/[a-z]/.test(value)) {
            callback(new Error('密码必须包含小写字母'))
            return
          }
          if (!/[0-9]/.test(value)) {
            callback(new Error('密码必须包含数字'))
            return
          }
          callback()
        }

        const validateConfirm = (rule, value, callback) => {
          if (!value) {
            callback(new Error('请再次输入密码'))
            return
          }
          if (value !== form.newPassword) {
            callback(new Error('两次输入的密码不一致'))
            return
          }
          callback()
        }

        const rules = {
          newPassword: [{ validator: validatePassword, trigger: 'blur' }],
          confirmPassword: [{ validator: validateConfirm, trigger: 'blur' }]
        }

        // 提交重置
        async function submitReset() {
          if (!formRef.value) return
          try {
            await formRef.value.validate()
          } catch (e) {
            return
          }

          if (!token || !email) {
            invalid.value = true
            return
          }

          loading.value = true
          try {
            // 初始化 CloudBase
            const app = cloudbase.init({
              env: 'cloud1-7g8ckb3c7815a011'
            })

            const res = await app.callFunction({
              name: 'emailLogin',
              data: {
                action: 'resetPassword',
                token: token,
                email: email,
                newPassword: form.newPassword
              }
            })

            if (res.result && res.result.success) {
              success.value = true
            } else {
              const errMsg = (res.result && res.result.error) || '重置失败'
              if (errMsg.includes('无效') || errMsg.includes('过期')) {
                invalid.value = true
              } else {
                ElementPlus.ElMessage.error(errMsg)
              }
            }
          } catch (err) {
            console.error('重置密码失败：', err)
            ElementPlus.ElMessage.error('网络错误，请稍后重试')
          } finally {
            loading.value = false
          }
        }

        function goLogin() {
          window.location.href = '/'
        }

        // 页面加载时检查 token 和 email 是否存在
        onMounted(() => {
          if (!token || !email) {
            invalid.value = true
          }
        })

        return {
          formRef,
          loading,
          success,
          invalid,
          form,
          rules,
          submitReset,
          goLogin
        }
      }
    }).use(ElementPlus).mount('#app')
  </script>
</body>
</html>
