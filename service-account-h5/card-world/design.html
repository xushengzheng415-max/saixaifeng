<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>编辑球员卡 · 赛小蜂足球</title>
  <link rel="stylesheet" href="css/app.css?v=20261104-ai11" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="topbar__back" href="./index.html" aria-label="返回我的球员卡">‹</a>
      <img class="topbar__logo" src="assets/card-world-icon.jpg" alt="赛小蜂" />
      <div class="topbar__title">
        <strong>编辑球员卡</strong>
        <span id="design-sub">更换照片 · 更换卡面 · 编辑构图</span>
      </div>
    </header>

    <main>
      <section class="state-card" id="state-loading">
        <i class="spinner"></i>
        <strong>正在读取卡面…</strong>
        <span>背景与形象照在手机上直接合成，不用等服务端出图</span>
      </section>

      <section class="state-card" id="state-error" hidden>
        <strong id="error-title">暂时无法进入编辑球员卡</strong>
        <p id="error-text">请稍后重试</p>
        <div class="state-card__actions">
          <button type="button" class="btn btn--gold" id="btn-retry">重新加载</button>
          <button type="button" class="btn btn--ghost" id="btn-ai-error" hidden>一键形象照</button>
        </div>
      </section>

      <section id="content" hidden>
        <!-- 卡面效果：完整卡面（背景 + 形象照），在本机实时合成，拖动即预览 -->
        <article class="panel">
          <div class="panel__head">
            <h2>卡面效果</h2>
            <span class="hint" id="preview-state">—</span>
          </div>
          <div class="design-stage" id="design-stage">
            <div class="design-stage__canvas" id="design-canvas"></div>
            <div class="design-stage__empty" id="design-empty">正在合成卡面…</div>
          </div>
          <div class="crop-bar" id="crop-bar" hidden>
            <p class="crop-bar__tip">按住卡面拖动，把形象照挪到想要的位置</p>
            <div class="slider-row slider-row--compact">
              <span>缩放</span>
              <input type="range" id="crop-zoom" min="1" max="4" step="0.05" value="1" />
              <em id="crop-zoom-value">1.00</em>
            </div>
            <div class="crop-bar__actions">
              <button type="button" class="btn btn--ghost" id="btn-crop-reset">重置</button>
              <button type="button" class="btn btn--gold" id="btn-crop-done">完成调整</button>
            </div>
          </div>
          <div class="design-actions">
            <button type="button" class="btn btn--ghost" id="btn-change-photo">更换照片</button>
            <button type="button" class="btn btn--ghost" id="btn-change-bg">更换卡面</button>
            <button type="button" class="btn btn--ghost" id="btn-edit-crop">编辑构图</button>
          </div>
          <p class="field__hint" id="design-hint">「更换照片」换掉卡面上的形象照（可相册上传或拍摄，也可一键 AI 生成）；「更换卡面」换背景；「编辑构图」直接把照片拖到合适位置。</p>
        </article>

        <!-- 背景卡面：只开放已达到的卡级，未达等级灰度显示并提示解锁积分 -->
        <article class="panel" id="background-panel">
          <div class="panel__head">
            <h2>更换卡面</h2>
            <span class="hint" id="background-hint">—</span>
          </div>
          <div class="backgrounds backgrounds--thumb" id="background-list"></div>
          <p class="field__hint">每张缩略图都是该背景下的成卡效果；未达等级的卡片显示为灰度，并标注解锁所需生涯积分。</p>
        </article>

        <div class="design-actions">
          <button type="button" class="btn btn--ghost" id="btn-back">返回卡库</button>
          <button type="button" class="btn btn--gold" id="btn-save">保存卡面</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 更换照片：两种方式 -->
  <div class="sheet" id="photo-sheet" hidden>
    <div class="sheet__mask" data-sheet-close="1"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="更换照片">
      <div class="sheet__head">
        <h2>更换照片</h2>
        <button type="button" class="sheet__close" data-sheet-close="1" aria-label="关闭">×</button>
      </div>
      <button type="button" class="sheet__option" id="opt-upload">
        <strong>相册上传或拍摄</strong>
        <small>用现成的单人照，服务端自动抠图成透明形象照</small>
      </button>
      <button type="button" class="sheet__option" id="opt-ai">
        <strong>一键形象照</strong>
        <small>上传头像和球服，AI 生成带动作的形象照（过程有合成动画）</small>
      </button>
      <p class="field__hint">两种方式都会先给你预览，确认后才写进这张球员卡。</p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/dynamic-card-renderer.js?v=20261104-ai7"></script>
  <script src="js/api.js?v=20261104-ai7"></script>
  <script src="js/design.js?v=20261104-ai11"></script>
</body>
</html>
