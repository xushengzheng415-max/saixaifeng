  <style>
    body{margin:0;color:#172a20;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7f6 url('./assets/bg-player-cards.jpg') center/cover fixed}body::before{content:'';position:fixed;inset:0;background:rgba(245,247,246,.78);pointer-events:none;z-index:0}main{position:relative;z-index:1;max-width:480px;margin:auto;padding:20px 16px 48px}header{position:relative;z-index:1;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(220,228,223,.6);padding-bottom:16px}header a{color:#172a20;text-decoration:none;font-weight:600}h1{font-size:20px;margin:0;color:#0d1f14}.state{position:relative;z-index:1;padding:64px 0;text-align:center}.state p{color:#172a20}.state button{font:inherit;background:#087744;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}.state a{color:#087744}

ay:flex;align-items:center;gap:6px;margin-top:5px}.pc .lib-state{font-size:10px;color:#6b7a71;background:#f0f4f1;border-radius:99px;padding:2px 7px}.pc .lib-state.is-action{margin-right:auto;background:rgba(8,119,68,.12);color:#087744}.pc .lib-check{position:absolute;top:6px;left:6px;background:#087744;color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;box-shadow:0 2px 6px rgba(8,119,68,.35)}.pc .lib-del{margin-left:auto;font:inherit;font-size:10px;color:#b5382d;background:rgba(181,56,45,.08);border:0;border-radius:99px;padding:3px 8px;cursor:pointer}.pc .lib-locks{margin:10px 0 0;font-size:11px;line-height:1.5;color:#6b7a71;background:rgba(240,244,241,.92);border-radius:8px;padding:6px 9px}.pc .lib-empty{margin:0;font-size:12px;color:#718078;background:rgba(240,244,241,.92);border-radius:10px;padding:12px;text-align:center}
