<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>球员登记 · 链路测试页</title><link rel="stylesheet" href="./service-entry.css?v=20261029-ai-sheet7"><style>
.test-banner{margin:0 0 12px;padding:8px 10px;border-radius:10px;background:#fff7e6;color:#8a5a00;font-size:12px;line-height:1.6}
.test-banner strong{display:block;margin-bottom:2px}
#trace{margin-top:18px;font-size:12px;color:#5b6b60}
#trace summary{cursor:pointer;color:#3a4a40}
#trace ol{margin:6px 0 0;padding-left:18px}
#trace li{margin:2px 0;word-break:break-all}
#trace li.bad{color:#b33429}
</style></head>
<body><main class="entry"><p class="test-banner" id="testBanner"><strong>链路测试页（正式登记页未改动）</strong>本页使用改版弹层：「立即生成」先扣蜂蜜再调模型，生成失败自动退回；「使用这张形象照」只入库，不再扣费；生成前可切换三种抱膀姿势；「球员卡预览」已改为平台金/银/铜基础卡（新登记球员尚未进入赛事正式名单）。</p><header><h1>球员登记</h1></header><div id="status" role="status">正在确认微信身份…</div><section id="content" hidden></section><a class="entry-return-link" href="./registration-resume.html">继续登记入口</a><section id="trace" hidden><details open><summary>接口记录（仅本页显示，不含令牌）</summary><ol id="traceList"></ol></details></section></main>
<script>
(function () {
  var query = new URLSearchParams(location.search)
  var entry = query.get('entry') || ''
  // 测试页允许省略 entry：复用本机已保存的登记会话（同一站点 localStorage 共享），
  // 这样在微信里不用手改地址栏也能直接打开测试页。取有效期最晚的一条。
  if (!entry) {
    var picked = '', pickedExpires = 0
    try {
      for (var index = 0; index < localStorage.length; index += 1) {
        var name = localStorage.key(index) || ''
        var matched = name.match(/^sxf_entry_session_(.+)$/)
        if (!matched) continue
        var expiresAt = 0
        try { expiresAt = Number((JSON.parse(localStorage.getItem(name) || 'null') || {}).expiresAt) || 0 } catch (error) {}
        if (expiresAt && expiresAt <= Date.now()) continue
        if (expiresAt >= pickedExpires) { picked = matched[1]; pickedExpires = expiresAt }
      }
    } catch (error) {}
    if (picked) {
      query.set('entry', picked)
      history.replaceState({}, document.title, location.pathname + '?' + query.toString())
      entry = picked
    }
  }
  var banner = document.getElementById('testBanner')
  if (banner) {
    if (!entry) {
      banner.innerHTML = '<strong>链路测试页（正式登记页未改动）</strong>未找到本机保存的登记会话：请先在微信里打开一次「继续登记」页（registration-resume.html）并点「继续填写」，再回到本页；也可以在本页地址后手动带上 ?entry=…'
    } else {
      banner.innerHTML = '<strong>链路测试页（正式登记页未改动）</strong>已复用本机保存的登记会话。本页使用改版弹层：「立即生成」先扣蜂蜜再调模型，生成失败自动退回；「使用这张形象照」只入库，不再扣费；生成前可切换三种抱膀姿势；「球员卡预览」已改为平台金/银/铜基础卡（新登记球员尚未进入赛事正式名单）。'
    }
  }

  var nativeFetch = window.fetch ? window.fetch.bind(window) : null
  if (!nativeFetch) return
  function mark(action, verdict, milliseconds, result) {
    var box = document.getElementById('trace')
    var list = document.getElementById('traceList')
    if (!box || !list) return
    box.hidden = false
    var detail = []
    if (result) {
      if (result.cost != null) detail.push('费用=' + result.cost)
      if (result.portraitCost != null) detail.push('费用=' + result.portraitCost)
      // 先扣费 / 退回是这一版最需要肉眼确认的两件事，单独列出来
      if (result.charge && result.charge.cost != null) detail.push('先扣=' + result.charge.cost + (result.charge.deduped ? '（幂等）' : ''))
      if (result.refundedAmount != null) detail.push('退回=' + result.refundedAmount)
      if (result.balance != null) detail.push('余额=' + result.balance)
      if (result.aiPortrait && result.aiPortrait.balance != null) detail.push('余额=' + result.aiPortrait.balance)
      if (result.code) detail.push('code=' + result.code)
      if (!result.success && (result.error || result.message)) detail.push(String(result.error || result.message))
    }
    var row = document.createElement('li')
    row.textContent = (action || '(未标 action)') + ' · ' + verdict + (milliseconds >= 0 ? ' · ' + milliseconds + 'ms' : '') + (detail.length ? ' · ' + detail.join(' · ') : '')
    if (/ERR|FAIL/.test(verdict)) row.className = 'bad'
    list.appendChild(row)
    while (list.children.length > 40) list.removeChild(list.firstChild)
  }
  // 只记录动作名、结果码、耗时与错误文案；请求体的令牌一律不打印。
  window.fetch = function (input, init) {
    var action = ''
    var started = Date.now()
    try { action = String((JSON.parse((init && init.body) || '{}') || {}).action || '') } catch (error) {}
    var request = nativeFetch(input, init)
    request.then(function (response) {
      var status = response.status
      response.clone().json().then(function (payload) {
        var result = payload
        try { if (payload && typeof payload.body === 'string') result = JSON.parse(payload.body) } catch (error) {}
        mark(action, (result && result.success ? 'OK' : 'ERR') + ' HTTP' + status, Date.now() - started, result)
      }, function () {
        mark(action, 'HTTP' + status + ' 非 JSON', Date.now() - started, null)
      })
    }, function (error) {
      mark(action, 'FAIL ' + (error && error.name === 'AbortError' ? '中断/超时' : '网络错误'), Date.now() - started, null)
    })
    return request
  }
})()
</script>
<script>window.SXF_SERVICE_ENTRY_MODE='player'</script>
<script>window.SXF_AI_SHEET_V2=true</script>
