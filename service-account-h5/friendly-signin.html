<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0aa85a">
<title>约球报名 · 赛小蜂足球</title>
<style>
:root{--green:#0aa85a;--green-dark:#065431;--ink:#16211c;--muted:#6b7a72;--line:#e6ece9;--bg:#f4f7f5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.page{max-width:600px;margin:0 auto;padding-bottom:36px}

/* ====== 头部 ====== */
.hero{background:linear-gradient(155deg,#0b2f23,#0f4f33 55%,#0aa85a);color:#fff;padding:34px 20px 26px;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.hero::after{content:'⚽';position:absolute;right:-6px;bottom:-26px;font-size:120px;opacity:.12}
.hero .eyebrow{font-size:13px;letter-spacing:3px;opacity:.75}
.hero h1{font-size:24px;font-weight:800;margin-top:8px;line-height:1.3}
.hero .versus{margin-top:12px;font-size:15px;opacity:.9}
.hero .versus b{font-weight:700}

/* ====== 通用卡片 ====== */
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 16px 0;box-shadow:0 4px 18px rgba(15,60,40,.07)}
.card-title{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eef6f1;color:var(--green-dark)}
.badge.is-terminal{background:#f7eeee;color:#b3261e}
.badge.is-accepted{background:#eaf4ff;color:#1360b3}
.badge.is-confirmed{background:#eaf7ef;color:#0a6b3c}
.badge.is-warn{background:#fff4e5;color:#b06a00}

.row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row .label{color:var(--muted);flex-shrink:0}
.row .value{font-weight:600;text-align:right;word-break:break-all}
.nav-link{margin-left:6px;padding:2px 8px;border-radius:8px;background:#eaf7ef;color:var(--green-dark);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}

/* ====== 战书 ====== */
.cry{background:linear-gradient(160deg,#fffaf0,#fff);border:1px solid #f3e3c7}
.cry .cry-style{font-size:12px;font-weight:700;color:#b06a00;background:#fff1d6;border-radius:999px;padding:3px 10px;display:inline-block;margin-bottom:10px}
.cry .cry-line{display:block;font-size:16px;font-weight:800;line-height:1.6}
.cry .cry-line.sub{font-size:14px;font-weight:500;color:#5a6461;margin-top:6px}

/* ====== 报名进度 ====== */
.progress{display:flex;gap:10px;margin-top:4px}
.metric{flex:1;background:#f7fbf8;border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.metric .num{font-size:22px;font-weight:800;color:var(--green-dark);line-height:1.1}
.metric .cap{font-size:12px;color:var(--muted);margin-top:6px}
.metric.is-unknown .num{font-size:16px;color:#b06a00}
.hint{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6}
.hint.is-warn{color:#b3261e}

/* ====== 表单 ====== */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:#3c4a44;margin-bottom:6px}
.field input[type=text],.field input[type=tel]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#f9fbfa;font-size:15px;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--green);background:#fff}
.side-pick{display:flex;gap:10px}
.side-opt{flex:1;position:relative}
.side-opt input{position:absolute;opacity:0;pointer-events:none}
.side-opt span{display:block;text-align:center;padding:11px 8px;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:600;color:#5a6461;background:#f9fbfa;word-break:break-all}
.side-opt input:checked+span{border-color:var(--green);background:#eaf7ef;color:var(--green-dark)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98);opacity:.92}
.btn.primary{background:linear-gradient(135deg,#0aa85a,#065431);color:#fff;box-shadow:0 8px 20px rgba(10,168,90,.28)}
.btn.ghost{background:#f2f5f3;color:#55635c}
.btn.danger{background:#fff1f0;color:#b3261e}
.btn[disabled]{opacity:.6;box-shadow:none;cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{margin:0}

/* ====== 我的报名 ====== */
.mine{background:#f2fbf5;border:1px solid #cdebd9}
.mine .name{font-size:17px;font-weight:800}
.mine .meta{font-size:12px;color:var(--muted);margin-top:4px}
.mine .status{margin-top:10px;font-size:13px;font-weight:700;color:var(--green-dark)}
.mine .status.is-off{color:#8a6d00}

/* ====== 提示 / 状态 ====== */
.notice{margin:14px 16px 0;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.6;background:#eaf4ff;color:#12508f;border:1px solid #cfe4fb}
.notice.error{background:#fdeeee;color:#b3261e;border-color:#f7d4d1}
.notice.success{background:#eaf7ef;color:#0a6b3c;border-color:#cdebd9}
.empty{padding:56px 26px;text-align:center;color:var(--muted)}
.empty h2{font-size:20px;color:#243029;margin-bottom:10px}
.empty p{font-size:14px;line-height:1.7}
.loading{padding:70px 20px;text-align:center;color:var(--muted);font-size:14px}
.loading .spinner{width:34px;height:34px;border:3px solid #dfe6e2;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{padding:22px 16px;text-align:center;color:#a8b3ad;font-size:12px;line-height:1.8}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
(function () {
  var API_URL = 'https://cloud1-7g8ckb3c7815a011-1419431905.ap-shanghai.app.tcloudbase.com/webLoginApi'
  var app = document.getElementById('app')
  var params = new URLSearchParams(location.search)
  var TOKEN = params.get('token') || ''
  // 只有对方球队带 teamId 进来时才展示「以球队身份接战」，球员扫码报名默认不出现
  var TEAM_ID = params.get('teamId') || ''
  var TEAM_NAME = params.get('teamName') || params.get('name') || ''
  var USER_ID = params.get('uid') || ''
  var storeKey = 'sxf_friendly_signup_' + (TOKEN || 'none')

  var view = { invite: null, mine: null, notice: null, busy: false, loading: true }

  function escapeHtml(value) {
    return (value == null ? '' : String(value)).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
    })
  }

  function api(action, payload) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action: 'friendlySignInWorkflow', workflowAction: action }, payload || {}))
    }).then(function (r) { return r.json() }).then(function (r) {
      if (r && typeof r.body === 'string') { try { return JSON.parse(r.body) } catch (e) { return r } }
      return r
    })
  }

  function readStore() {
    try { return JSON.parse(localStorage.getItem(storeKey) || 'null') } catch (e) { return null }
  }
  function writeStore(next) {
    try { localStorage.setItem(storeKey, JSON.stringify(next)) } catch (e) { /* 隐私模式下忽略 */ }
  }

  function phoneOk(value) {
    return /^1\d{10}$/.test(String(value || '').replace(/\D/g, ''))
  }

  // 历史邀约缺计数时服务端回 null：显示「待确认」，不显示 0
  function countText(value, known) {
    if (known === false) return '待确认'
    if (value === null || value === undefined || value === '') return '待确认'
    return String(value)
  }

  function dateText(invite) {
    var date = invite.matchDate || ''
    var time = invite.matchTime || ''
    if (!date && !time) return '时间待确认'
    return (date + ' ' + time).trim()
  }

  function deadlineText(invite) {
    return invite.deadline ? String(invite.deadline).replace('T', ' ') : '不限'
  }

  function statusBadge(invite) {
    var status = invite.status || 'open'
    var cls = 'badge'
    if (status === 'cancelled' || status === 'closed') cls += ' is-terminal'
    else if (status === 'accepted') cls += ' is-accepted'
    else if (status === 'confirmed') cls += ' is-confirmed'
    return '<span class="' + cls + '">' + escapeHtml(invite.statusText || '报名中') + '</span>'
  }

  function venueText(invite) {
    var name = invite.venue || '场地待确认'
    var lat = Number(invite.latitude) || 0
    var lng = Number(invite.longitude) || 0
    var html = escapeHtml(name)
    if (lat && lng) {
      var mapUrl = 'https://uri.amap.com/marker?position=' + lng + ',' + lat +
        '&name=' + encodeURIComponent(name) +
        (invite.venueAddress ? '&address=' + encodeURIComponent(invite.venueAddress) : '') +
        '&coordinate=gaode&callnative=1'
      html += '<a class="nav-link" href="' + mapUrl + '" target="_blank" rel="noopener">导航</a>'
    }
    return html
  }

  function heroHtml(invite) {
    return '<div class="hero">' +
      '<span class="eyebrow">⚽ 约球报名</span>' +
      '<h1>' + escapeHtml(invite.teamName || '我方') + ' 发起约球</h1>' +
      '<div class="versus">对阵 <b>' + escapeHtml(invite.opponentName || '待定对手') + '</b> · ' + escapeHtml(dateText(invite)) + '</div>' +
      '</div>'
  }

  function summaryHtml(invite) {
    return '<div class="card">' +
      '<div class="card-title"><span>比赛信息</span>' + statusBadge(invite) + '</div>' +
      '<div class="row"><span class="label">时间</span><span class="value">' + escapeHtml(dateText(invite)) + '</span></div>' +
      '<div class="row"><span class="label">场地</span><span class="value">' + venueText(invite) + '</span></div>' +
      '<div class="row"><span class="label">限额</span><span class="value">' + (Number(invite.maxPlayers) || 0) + ' 人</span></div>' +
      '<div class="row"><span class="label">报名截止</span><span class="value">' + escapeHtml(deadlineText(invite)) + '</span></div>' +
      '</div>'
  }

  function progressHtml(invite) {
    var known = invite.signupCountKnown === false ? false : true
    var count = countText(invite.signupCount, known)
    var acceptedText = invite.acceptedCount === null || invite.acceptedCount === undefined
      ? '待确认'
      : (Number(invite.acceptedCount) > 0 ? '已接战' : '未接战')
    return '<div class="card">' +
      '<div class="card-title"><span>报名进度</span></div>' +
      '<div class="progress">' +
      '<div class="metric' + (known ? '' : ' is-unknown') + '"><div class="num">' + escapeHtml(count) + '</div><div class="cap">已报名</div></div>' +
      '<div class="metric"><div class="num">' + (Number(invite.maxPlayers) || 0) + '</div><div class="cap">名额上限</div></div>' +
      '<div class="metric"><div class="num" style="font-size:16px">' + escapeHtml(acceptedText) + '</div><div class="cap">对方接战</div></div>' +
      '</div>' +
      (known ? '' : '<div class="hint">历史邀约未记录报名名单，报名人数显示「待确认」，现场以球队管理页名单为准。</div>') +
      '</div>'
  }

  function cryHtml(invite) {
    var cry = invite.battleCry || {}
    var lines = (cry.lines && cry.lines.length) ? cry.lines : [cry.text || '来一场友谊赛吧', '']
    return '<div class="card cry">' +
      '<span class="cry-style">' + escapeHtml((cry.styleEmoji || '📋') + ' ' + (cry.styleLabel || '约球邀约')) + '</span>' +
      '<span class="cry-line">' + escapeHtml(lines[0] || '') + '</span>' +
      (lines[1] ? '<span class="cry-line sub">' + escapeHtml(lines[1]) + '</span>' : '') +
      '</div>'
  }

  function noticeHtml() {
    if (!view.notice) return ''
    var kind = view.notice.type === 'error' ? ' notice error' : (view.notice.type === 'success' ? ' notice success' : ' notice')
    return '<div class="' + kind.trim() + '">' + escapeHtml(view.notice.text) + '</div>'
  }

  function sideOptionsHtml(invite) {
    var own = escapeHtml(invite.teamName || '本方')
    var opp = escapeHtml(invite.opponentName || '对方')
    return '<div class="field"><label>你属于哪一方</label><div class="side-pick">' +
      '<label class="side-opt"><input type="radio" name="side" value="own" checked><span>' + own + '</span></label>' +
      '<label class="side-opt"><input type="radio" name="side" value="opponent"><span>' + opp + '</span></label>' +
      '</div></div>'
  }

  function formHtml(invite, stored) {
    return '<div class="card" id="signupCard">' +
      '<div class="card-title"><span>我要报名</span></div>' +
      '<div class="field"><label for="userName">姓名</label>' +
      '<input id="userName" type="text" maxlength="20" placeholder="请输入真实姓名" value="' + escapeHtml(stored && stored.name || '') + '"></div>' +
      '<div class="field"><label for="userPhone">手机号</label>' +
      '<input id="userPhone" type="tel" maxlength="11" inputmode="numeric" placeholder="用于现场核对，不会公开" value="' + escapeHtml(stored && stored.phone || '') + '"></div>' +
      sideOptionsHtml(invite) +
      '<button class="btn primary" id="signupBtn">提交报名</button>' +
      '<div class="hint">报名后可在本页查看报名状态或取消报名；现场签到由球队管理页勾选。</div>' +
      '</div>'
  }

  function mineHtml(invite, mine) {
    var signup = mine && mine.mySignup
    if (!signup) return ''
    var active = signup.status === 'signup' || signup.status === 'present'
    var sideText = signup.side === 'opponent' ? '对方' : '本方'
    return '<div class="card mine">' +
      '<div class="card-title"><span>我的报名</span><span class="badge' + (active ? '' : ' is-warn') + '">' + escapeHtml(signup.statusText || '') + '</span></div>' +
      '<div class="name">' + escapeHtml(signup.userName || '') + '</div>' +
      '<div class="meta">身份：' + sideText + '</div>' +
      (active
        ? '<div class="status">已占用名额，到场后由球队勾选签到</div>' +
          (signup.canCancel ? '<div class="btn-row" style="margin-top:14px"><button class="btn danger" id="cancelBtn">取消报名</button></div>' : '')
        : '<div class="status is-off">该报名已失效，如需继续参加请重新报名</div>') +
      '</div>'
  }

  function teamResponseHtml(invite) {
    if (!TEAM_ID) return ''
    var accepted = invite.acceptedTeamId && invite.acceptedTeamId === TEAM_ID
    if (accepted) {
      return '<div class="card"><div class="card-title"><span>球队接战</span></div>' +
        '<div class="hint">「' + escapeHtml(TEAM_NAME || '你们球队') + '」已接战，等发起方确认成局。</div></div>'
    }
    if (invite.terminal) return ''
    return '<div class="card">' +
      '<div class="card-title"><span>以球队身份接战</span></div>' +
      '<div class="hint">接战会把「' + escapeHtml(TEAM_NAME || '你们球队') + '」登记为本场对手，发起方可在小程序确认成局。</div>' +
      '<div class="btn-row" style="margin-top:12px">' +
      '<button class="btn ghost" id="rejectInviteBtn">无法应战</button>' +
      '<button class="btn primary" id="acceptInviteBtn">接战</button>' +
      '</div></div>'
  }

  function closedHtml(invite) {
    if (!invite.terminal) return ''
    return '<div class="notice error">' + escapeHtml(invite.statusText || '邀约已结束') +
      (invite.signupClosedReason ? '：' + escapeHtml(invite.signupClosedReason) : '') + '，无需到场。</div>'
  }

  function render() {
    var invite = view.invite || {}
    var html = heroHtml(invite) + noticeHtml() + closedHtml(invite) + summaryHtml(invite) + progressHtml(invite) + cryHtml(invite)

    var stored = readStore()
    var mine = view.mine
    var mySignup = mine && mine.mySignup
    var activeMy = mySignup && (mySignup.status === 'signup' || mySignup.status === 'present')

    if (activeMy) {
      html += mineHtml(invite, mine)
    } else if (!invite.terminal && invite.canSignUp) {
      html += formHtml(invite, stored)
    } else {
      html += '<div class="notice">' + escapeHtml(invite.signupClosedReason || '当前不可报名') + '</div>'
      if (mySignup && !activeMy) html += mineHtml(invite, mine)
    }

    html += teamResponseHtml(invite)
    html += '<div class="footer">赛小蜂足球 · 约球报名<br>报名问题请联系发起球队</div>'
    app.innerHTML = html
    bind()
  }

  function bind() {
    var signupBtn = document.getElementById('signupBtn')
    if (signupBtn) signupBtn.onclick = submitSignup
    var cancelBtn = document.getElementById('cancelBtn')
    if (cancelBtn) cancelBtn.onclick = cancelSignup
    var acceptBtn = document.getElementById('acceptInviteBtn')
    if (acceptBtn) acceptBtn.onclick = function () { respondInvite('accepted') }
    var rejectBtn = document.getElementById('rejectInviteBtn')
    if (rejectBtn) rejectBtn.onclick = function () { respondInvite('rejected') }
  }

  function currentSide() {
    var checked = document.querySelector('input[name=side]:checked')
    return checked && checked.value === 'opponent' ? 'opponent' : 'own'
  }

  function submitSignup() {
    if (view.busy) return
    var nameEl = document.getElementById('userName')
    var phoneEl = document.getElementById('userPhone')
    var name = String(nameEl && nameEl.value || '').trim().slice(0, 20)
    var phone = String(phoneEl && phoneEl.value || '').replace(/\D/g, '')
    if (!name) { setNotice('请填写姓名', 'error'); return }
    if (!phoneOk(phone)) { setNotice('请填写正确的 11 位手机号', 'error'); return }

    view.busy = true
    var btn = document.getElementById('signupBtn')
    if (btn) { btn.disabled = true; btn.textContent = '提交中…' }

    api('signUpInvite', { token: TOKEN, userName: name, userPhone: phone, side: currentSide(), source: 'h5_signup' })
      .then(function (r) {
        view.busy = false
        if (!r || !r.success) {
          setNotice((r && r.message) || '报名失败，请重试', 'error')
          if (btn) { btn.disabled = false; btn.textContent = '提交报名' }
          return
        }
        writeStore({ name: name, phone: phone, side: currentSide() })
        setNotice(r.data && r.data.alreadySignedUp ? '你已经报过名了' : '报名成功，现场见！', 'success')
        refresh()
      })
      .catch(function (err) {
        view.busy = false
        setNotice((err && err.message) || '网络错误，请重试', 'error')
        if (btn) { btn.disabled = false; btn.textContent = '提交报名' }
      })
  }

  function cancelSignup() {
    if (view.busy) return
    var stored = readStore()
    var phone = String(view.mine && view.mine.mySignup && stored && stored.phone || stored && stored.phone || '')
    if (!phoneOk(phone)) { setNotice('没有找到报名手机号，请重新报名后再试', 'error'); return }
    if (!window.confirm('确定取消报名吗？名额会释放给其他球员。')) return

    view.busy = true
    var btn = document.getElementById('cancelBtn')
    if (btn) { btn.disabled = true; btn.textContent = '处理中…' }
    api('cancelInviteSignup', { token: TOKEN, userPhone: phone })
      .then(function (r) {
        view.busy = false
        if (!r || !r.success) {
          setNotice((r && r.message) || '取消失败，请重试', 'error')
          if (btn) { btn.disabled = false; btn.textContent = '取消报名' }
          return
        }
        setNotice('已取消报名', 'success')
        refresh()
      })
      .catch(function (err) {
        view.busy = false
        setNotice((err && err.message) || '网络错误，请重试', 'error')
        if (btn) { btn.disabled = false; btn.textContent = '取消报名' }
      })
  }

  function respondInvite(status) {
    if (view.busy) return
    view.busy = true
    api('respondInvite', {
      token: TOKEN,
      status: status,
      teamId: TEAM_ID,
      teamName: TEAM_NAME,
      opponentTeamName: TEAM_NAME,
      userId: USER_ID,
      userName: TEAM_NAME
    }).then(function (r) {
      view.busy = false
      if (!r || !r.success) {
        setNotice((r && r.message) || '操作失败，请重试', 'error')
        return
      }
      setNotice(status === 'accepted' ? '已接战，等发起方确认成局' : '已回复无法应战', status === 'accepted' ? 'success' : 'info')
      refresh()
    }).catch(function (err) {
      view.busy = false
      setNotice((err && err.message) || '网络错误，请重试', 'error')
    })
  }

  function setNotice(text, type) {
    view.notice = { text: text, type: type || 'info' }
    render()
  }

  function renderLoading() {
    app.innerHTML = '<div class="hero"><span class="eyebrow">⚽ 赛小蜂足球</span><h1>约球报名</h1></div>' +
      '<div class="loading"><div class="spinner"></div>正在获取约球信息…</div>'
  }

  function renderEmpty(title, message) {
    app.innerHTML = '<div class="hero"><span class="eyebrow">⚽ 赛小蜂足球</span><h1>约球报名</h1></div>' +
      '<div class="empty"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(message) + '</p></div>' +
      '<div class="footer">赛小蜂足球</div>'
  }

  function refresh() {
    var stored = readStore()
    var phone = stored && stored.phone ? stored.phone : ''
    var detail = api('getInvite', { token: TOKEN })
    var mine = phoneOk(phone) ? api('getMyInviteStatus', { token: TOKEN, userPhone: phone }) : Promise.resolve(null)
    return Promise.all([detail, mine]).then(function (list) {
      var res = list[0]
      if (!res || !res.success) {
        renderEmpty('约球不存在或已关闭', (res && res.message) || '请确认链接是否完整，或联系发起球队')
        return
      }
      view.invite = res.data || {}
      view.mine = (list[1] && list[1].success) ? list[1].data : null
      view.loading = false
      render()
    }).catch(function (err) {
      renderEmpty('网络错误', (err && err.message) || '请稍后重试')
    })
  }

  if (!TOKEN) {
    renderEmpty('链接无效', '请从球队分享的报名链接或海报二维码进入')
    return
  }
  renderLoading()
  refresh()
})()
</script>
</body>
</html>
