<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>球员资料｜赛小蜂足球</title><link rel="stylesheet" href="./player-review.css?v=20261102-1"></head><body><main><header><h1 id="title">球员资料</h1><a href="./me.html">我的服务</a></header><p id="status" role="status">正在读取…</p><section id="task" hidden><h2 id="team"></h2><p id="reason"></p><div id="players"></div></section><form id="profile" hidden><img id="photo" alt="球员照片"><label>更换照片<input id="photoFile" type="file" accept="image/png,image/jpeg"></label><div class="fields"><label>姓名<input name="name" required maxlength="50"></label><label>球衣名<input name="jerseyName" maxlength="40"></label><label>证件类型<select name="documentType"><option value="resident_id">身份证</option><option value="passport">护照</option></select></label><label>证件号码<input name="identityNumber" autocomplete="off" maxlength="30" placeholder="不修改可留空"></label><p id="identityHint" class="full"></p><label>出生日期<input name="birthDate" type="date" required></label><label>性别<select name="gender"><option value="">请选择</option><option value="male">男</option><option value="female">女</option></select></label><label>籍贯<input name="nativePlace" maxlength="60"></label><label>国籍<input name="nationality" maxlength="40"></label><label>球衣号码<input name="jerseyNumber" type="number" min="1" max="99" required></label><label>场上位置<select name="position" required><option value="">请选择</option><option value="GK">守门员</option><option value="DF">后卫</option><option value="MF">前卫</option><option value="FW">前锋</option></select></label><label>惯用脚<select name="strongFoot"><option value="">请选择</option><option value="left">左脚</option><option value="right">右脚</option><option value="both">双脚</option></select></label><label>身高（厘米）<input name="height" type="number" min="50" max="250" step="0.1"></label><label>体重（公斤）<input name="weight" type="number" min="10" max="200" step="0.1"></label></div><p>提交后由主办方复审；证件修改需重新核验。</p><button id="submit" type="submit">重新提交</button></form><button id="retry" hidden type="button">重新读取</button></main><script src="./player-review.js?v=20261102-1"></script></body></html>
