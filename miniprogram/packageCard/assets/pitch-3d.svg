<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f8a4a"/>
      <stop offset="45%" stop-color="#14703a"/>
      <stop offset="100%" stop-color="#0a3d22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2a18"/>
      <stop offset="100%" stop-color="#061810"/>
    </linearGradient>
    <pattern id="stripes" width="56" height="1000" patternUnits="userSpaceOnUse">
      <rect width="28" height="1000" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- stadium dark surround -->
  <rect width="800" height="1000" fill="url(#edge)"/>
  <!-- trapezoid pitch: top narrower -->
  <polygon points="170,70 630,70 760,930 40,930" fill="url(#g)"/>
  <polygon points="170,70 630,70 760,930 40,930" fill="url(#stripes)"/>
  <!-- touchline -->
  <polygon points="190,95 610,95 735,905 65,905" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
  <!-- halfway -->
  <line x1="127" y1="500" x2="673" y2="500" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
  <!-- center circle -->
  <ellipse cx="400" cy="500" rx="95" ry="70" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
  <circle cx="400" cy="500" r="5" fill="rgba(255,255,255,0.55)"/>
  <!-- far box -->
  <path d="M260,95 L540,95 L555,190 L245,190 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.2"/>
  <path d="M310,95 L490,95 L498,145 L302,145 Z" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <!-- near box -->
  <path d="M210,905 L590,905 L565,780 L235,780 Z" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.2"/>
  <path d="M275,905 L525,905 L510,845 L290,845 Z" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <!-- soft vignette -->
  <ellipse cx="400" cy="500" rx="420" ry="480" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="80" filter="url(#soft)"/>
</svg>
