<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780"><rect width="600" height="780" fill="#f5f9f6"/><rect width="600" height="170" fill="#087c47"/><g font-family="Microsoft YaHei,Arial" text-anchor="middle"><text x="300" y="65" font-size="24" fill="#fff">赛小蜂足球 · 演示示例</text><text x="300" y="120" font-size="38" font-weight="700" fill="#fff">球队参赛邀请</text><text x="300" y="232" font-size="27" font-weight="700" fill="#173e29">青春杯青少年足球邀请赛</text><text x="300" y="281" font-size="21" fill="#506457">青少年组 · 八人制 · 8 支球队</text><text x="300" y="338" font-size="20" fill="#30483a">比赛日期　示例日期</text><text x="300" y="378" font-size="20" fill="#30483a">比赛地点　模拟足球训练基地</text><text x="300" y="418" font-size="20" fill="#30483a">报名资料　球队、人员名单、队徽和照片</text><rect x="210" y="460" width="180" height="180" rx="8" fill="#fff" stroke="#a9bdaf" stroke-width="2"/><path d="M240 490h35v35h-35zm85 0h35v35h-35zm-85 85h35v35h-35" fill="none" stroke="#087c47" stroke-width="7"/><text x="300" y="555" font-size="18" fill="#087c47">二维码示例</text><text x="300" y="692" font-size="22" fill="#173e29">扫码报名 → 填写名单 → 提交审核</text><text x="300" y="739" font-size="18" fill="#67776c">仅展示邀请内容，不生成真实报名入口</text></g></svg>
