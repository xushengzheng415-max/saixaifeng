<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组织者首页 · 原型预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eeea;color:#153c2b;font:14px "Microsoft YaHei",sans-serif}.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;padding:16px 24px;border-bottom:1px solid #d6e1d9}.toolbar h1{font-size:17px;margin:0}.toolbar small{font-size:12px;color:#7c8f81}.toolbar button{border:0;background:#eaf3ec;color:#19633f;padding:9px 13px;border-radius:6px;cursor:pointer}.toolbar button.active{background:#087a48;color:white}.boards{display:flex;justify-content:center;align-items:flex-start;gap:42px;padding:30px 25px 40px}.board{width:390px}.board h2{font-size:16px;margin:0 0 8px}.board p{font-size:12px;color:#6d8575;margin:0 0 18px}.phone{overflow:hidden;border-radius:28px;box-shadow:0 8px 25px #01291c15;outline:7px solid #142c23}iframe{border:0;width:390px;height:844px;display:block;background:#edf3ef}.note{max-width:822px;margin:0 auto 30px;font-size:12px;line-height:1.8;color:#6d8575}@media(max-width:860px){.boards{display:block;padding:30px 15px}.board{margin:auto auto 36px}.toolbar small{display:none}.board.hidden{display:none}.note{padding:0 20px}}@media(max-width:420px){.board{width:100%}.phone{border-radius:18px}iframe{width:100%}.toolbar{padding:14px;gap:8px}.toolbar h1{font-size:14px}}</style></head><body><header class="toolbar"><div><h1>组织者首页</h1><small>原型演示 · 仅调整首页</small></div><div><button class="active" onclick="choose(0)">首次办赛</button> <button onclick="choose(1)">已有赛事</button></div></header><main class="boards"><section class="board"><h2>01 / 首次办赛</h2><p>进来就能发起赛事，也能转到电脑继续。</p><div class="phone"><iframe title="首次办赛" src="P01-首次办赛.html"></iframe></div></section><section class="board"><h2>02 / 已有赛事</h2><p>先处理待办，再进入赛事和球队。</p><div class="phone"><iframe title="已有赛事" src="P02-已有赛事.html"></iframe></div></section></main><p class="note">示意数据仅用于设计。赛事、球队页面保持现有版本；点击入口仅演示页面去向。手机内可滚动查看完整首页。</p><script>function choose(i){document.querySelectorAll('.toolbar button').forEach((b,n)=>b.classList.toggle('active',n===i));document.querySelectorAll('.board').forEach((b,n)=>b.classList.toggle('hidden',n!==i))}if(innerWidth<=860)choose(0)</script></body></html>
